name: Atlas Core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Core build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Atlas Core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set external test root
        run: echo "ATLAS_TEST_ROOT=$RUNNER_TEMP/atlas-core" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            Atlas Protocol/package-lock.json
            Atlas Core/package-lock.json
            Atlas Core/operator/package-lock.json
      - run: npm run build:prepare
      - run: npm install --global --offline --ignore-scripts --no-audit --no-fund ./artifacts/npm-11.19.0.tgz
      - run: npm run protocol:prepare
      - run: npm ci --include=dev
      - run: npm test
      - name: Install operator qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace python3 openssl
      - run: npm run operator:prepare
      - run: npm run operator:build
      - run: npm run test:operator
      - run: npm run test:operator-package
      - run: npm run image:build
      - name: Pack and verify the operator for the built image
        env:
          ATLAS_OPERATOR_OUT: ${{ runner.temp }}/atlas-release-operator
        run: |
          npm run operator:pack
          node "$RUNNER_TEMP/atlas-release-operator/verify-operator-tarball.mjs" "$RUNNER_TEMP/atlas-release-operator/atlas-core-operator-qualification-0.6.0.tgz" "$RUNNER_TEMP/atlas-release-operator/operator-manifest.json"
          npm install --global --offline --ignore-scripts --no-audit --no-fund --update-notifier=false --cache "$RUNNER_TEMP/atlas-release-cache" --prefix "$RUNNER_TEMP/atlas-operator-install" "$RUNNER_TEMP/atlas-release-operator/atlas-core-operator-qualification-0.6.0.tgz"
      - run: npm run test:container
        env:
          ATLAS_TEST_CLI: ${{ runner.temp }}/atlas-operator-install/bin/atlas-core
      - run: npm run fixture:retention
      - name: Preserve failed capture evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-capture-failures
          path: ${{ env.ATLAS_TEST_ROOT }}/capture-failures
          if-no-files-found: ignore
          retention-days: 7
