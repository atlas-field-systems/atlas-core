name: S1 implementation checkout

on:
  push:
    branches: [codex/spec-122-s1]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package committed source without credentials
        run: git bundle create "$RUNNER_TEMP/spec-122-source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: spec-122-source
          path: ${{ runner.temp }}/spec-122-source.bundle
          retention-days: 1
          if-no-files-found: error
