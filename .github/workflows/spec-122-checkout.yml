name: S1 implementation checkout

on:
  push:
    branches: [codex/spec-122-s1]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package committed source without credentials
        run: git bundle create "$RUNNER_TEMP/spec-122-source.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: spec-122-source
          path: ${{ runner.temp }}/spec-122-source.bundle
          retention-days: 1
          if-no-files-found: error
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Verify the locked baseline
        run: python3 scripts/verify.py --bootstrap
      - name: Package nonsecret development tools and dependency files
        if: always()
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/spec-122-runtime.tar.gz" \
            -C "$HOME/.cache" atlas-protocol-tools \
            -C "$HOME/go" pkg/mod \
            -C "$GITHUB_WORKSPACE/Atlas SDK" node_modules \
            -C "$(dirname "$(dirname "$(command -v node)")")" bin lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-122-runtime
          path: ${{ runner.temp }}/spec-122-runtime.tar.gz
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-122-baseline-evidence
          path: .artifacts/verification*
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: warn
