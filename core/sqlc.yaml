# One entry per module. Each module's queries generate into its private
# internal/db package; schema comes from the owning database's migrations.
version: "2"
sql:
  - engine: sqlite
    schema: internal/storage/migrations/installation
    queries: internal/identity/queries.sql
    gen:
      go:
        package: db
        out: internal/identity/internal/db
  - engine: sqlite
    schema: internal/storage/migrations/operational
    queries: internal/datasets/queries.sql
    gen:
      go:
        package: db
        out: internal/datasets/internal/db
  - engine: sqlite
    schema: internal/storage/migrations/operational
    queries: internal/entities/queries.sql
    gen:
      go:
        package: db
        out: internal/entities/internal/db
  - engine: sqlite
    schema: internal/storage/migrations/operational
    queries: internal/changes/queries.sql
    gen:
      go:
        package: db
        out: internal/changes/internal/db
  - engine: sqlite
    schema: internal/storage/migrations/operational
    queries: internal/tasks/queries.sql
    gen:
      go:
        package: db
        out: internal/tasks/internal/db
  - engine: sqlite
    schema: internal/storage/migrations/operational
    queries: internal/activity/queries.sql
    gen:
      go:
        package: db
        out: internal/activity/internal/db
  - engine: sqlite
    schema: internal/storage/migrations/installation
    queries: internal/plugins/registry.sql
    gen:
      go:
        package: registrydb
        out: internal/plugins/internal/registrydb
  - engine: sqlite
    schema: internal/storage/migrations/operational
    queries: internal/plugins/operations.sql
    gen:
      go:
        package: operationsdb
        out: internal/plugins/internal/operationsdb
