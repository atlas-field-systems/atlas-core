openapi: 3.0.3
info:
  title: Atlas Protocol
  version: 0.1.0
  description: |
    Public Atlas Core operations.

    Every request carries one credential as `Authorization: Bearer <key>`. Each
    security scheme below names a kind of caller; an operation lists the kinds
    that may call it. Core rejects a missing or unknown credential with 401 and a
    known credential of an unlisted kind with 403.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check process liveness
      security:
        - operator: []
        - enrollment: []
        - asset: []
      responses:
        '200':
          description: Core is serving requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /readiness:
    get:
      operationId: getReadiness
      summary: Check required storage dependencies
      security:
        - operator: []
        - enrollment: []
        - asset: []
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: At least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dataset:
    get:
      operationId: getDataset
      summary: Discover the current Dataset
      security:
        - operator: []
        - enrollment: []
        - asset: []
      responses:
        '200':
          description: Current Dataset identity and writing release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /entities:
    post:
      operationId: createEntity
      summary: Enroll an Asset with deployment authorization
      description: |
        The request ID and original facts identify one enrollment. A matching
        retry returns the current Asset with 200; changed facts under the same
        request or Asset ID conflict.
      security:
        - enrollment: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetEnrollmentRequest'
      responses:
        '201':
          description: Asset enrolled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEnrollmentResult'
        '200':
          description: Matching enrollment retry; the current Asset is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEnrollmentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /entities/{entity_id}:
    get:
      operationId: getEntity
      summary: Read an operational Entity
      security:
        - operator: []
        - asset: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Current Entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /entities/{entity_id}/status:
    patch:
      operationId: reportAssetStatus
      summary: Report an Asset's own operational status
      description: Only the Asset itself may report. Reports apply in increasing sequence order; resending a report ID with the same facts returns the current Asset.
      security:
        - asset: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetStatusReport'
      responses:
        '200':
          description: Current Asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    EntityId:
      name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    operator:
      type: http
      scheme: bearer
      description: Administrative credential issued by local setup or recovery.
    enrollment:
      type: http
      scheme: bearer
      description: Deployment enrollment authority created by local setup. It may only enroll Assets.
    asset:
      type: http
      scheme: bearer
      description: An enrolled Asset's own credential, bound to its Entity ID.
  responses:
    BadRequest:
      description: The request does not match the operation's schema or rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or unknown credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credential's kind may not call this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with a retained identity, order or the current Dataset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [alive]
    DependencyStatus:
      type: string
      enum: [ready, unavailable]
    Readiness:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        dependencies:
          type: object
          additionalProperties: false
          required: [sqlite, objects]
          properties:
            sqlite:
              $ref: '#/components/schemas/DependencyStatus'
            objects:
              $ref: '#/components/schemas/DependencyStatus'
    Dataset:
      type: object
      additionalProperties: false
      required: [id, writing_release]
      properties:
        id:
          type: string
          format: uuid
        writing_release:
          type: string
    AssetStatus:
      type: string
      enum: [unknown, initializing, ready, busy, paused, error, stopped]
    Communications:
      type: string
      enum: [high_bandwidth, healthy, degraded, offline]
    Entity:
      type: object
      additionalProperties: false
      required: [id, kind, alias, subtype, components, command_manifest, version]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [asset]
        alias:
          type: string
          nullable: true
        subtype:
          type: string
          nullable: true
        components:
          $ref: '#/components/schemas/AssetComponents'
        command_manifest:
          type: array
          items:
            $ref: '#/components/schemas/CommandSupport'
        version:
          type: integer
          minimum: 1
    AssetComponents:
      type: object
      additionalProperties: false
      required: [status, communications, heartbeat]
      properties:
        status:
          $ref: '#/components/schemas/AssetStatusComponent'
        communications:
          $ref: '#/components/schemas/AssetCommunicationsComponent'
        heartbeat:
          $ref: '#/components/schemas/AssetHeartbeatComponent'
        telemetry:
          $ref: '#/components/schemas/AssetTelemetryComponent'
        health:
          $ref: '#/components/schemas/AssetHealthComponent'
    AssetStatusComponent:
      type: object
      additionalProperties: false
      required: [value, reported_at]
      properties:
        value:
          $ref: '#/components/schemas/AssetStatus'
        reported_at:
          type: string
          format: date-time
          nullable: true
          description: When Core accepted the latest status report; null until the Asset reports status.
    AssetCommunicationsComponent:
      type: object
      additionalProperties: false
      required: [link_state]
      properties:
        link_state:
          $ref: '#/components/schemas/Communications'
    AssetHeartbeatComponent:
      type: object
      additionalProperties: false
      required: [last_seen]
      properties:
        last_seen:
          type: string
          format: date-time
          nullable: true
    AssetInitialStatus:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          $ref: '#/components/schemas/AssetStatus'
    AssetInitialComponents:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/AssetInitialStatus'
        telemetry:
          $ref: '#/components/schemas/AssetTelemetryComponent'
        health:
          $ref: '#/components/schemas/AssetHealthComponent'
    AssetTelemetryComponent:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Latitude and longitude are supplied together.
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        altitude_m:
          type: number
          format: double
        speed_mps:
          type: number
          format: double
          minimum: 0
        heading_deg:
          type: number
          format: double
          minimum: 0
          maximum: 360
          exclusiveMaximum: true
    AssetHealthComponent:
      type: object
      additionalProperties: false
      required: [battery_percent]
      properties:
        battery_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
    CommandSupport:
      type: object
      additionalProperties: false
      required: [command_id, scheduling]
      properties:
        command_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        scheduling:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [queued, immediate]
        cancellation:
          type: boolean
        progress:
          type: boolean
        description:
          type: string
          maxLength: 256
    AssetEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [dataset_id, id, request_id, kind, credential]
      properties:
        dataset_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [asset]
        credential:
          type: string
          pattern: '^atlas_asset_[A-Za-z0-9_-]{43}$'
          description: The Asset's own credential, prepared and retained by the SDK before the first attempt.
        alias:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
          description: Unique across Entities, ignoring case.
        subtype:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
        components:
          $ref: '#/components/schemas/AssetInitialComponents'
        command_manifest:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/CommandSupport'
    AssetEnrollmentResult:
      type: object
      additionalProperties: false
      required: [asset, principal_id, credential_id]
      properties:
        asset:
          $ref: '#/components/schemas/Entity'
        principal_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
    AssetStatusReport:
      type: object
      additionalProperties: false
      required: [dataset_id, report_id, sequence, status]
      properties:
        dataset_id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: '#/components/schemas/AssetStatus'
