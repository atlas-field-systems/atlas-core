openapi: 3.0.3
info:
  title: Atlas Protocol
  version: 0.1.0
  description: |
    Public Atlas Core operations.

    Every request carries one credential as `Authorization: Bearer <key>`. Each
    security scheme below names a kind of caller; an operation lists the kinds
    that may call it. Core rejects a missing or unknown credential with 401 and a
    known credential of an unlisted kind with 403.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check process liveness
      security:
        - operator: []
        - enrollment: []
        - asset: []
        - plugin: []
      responses:
        '200':
          description: Core is serving requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /readiness:
    get:
      operationId: getReadiness
      summary: Check required storage dependencies
      security:
        - operator: []
        - enrollment: []
        - asset: []
        - plugin: []
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: At least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dataset:
    get:
      operationId: getDataset
      summary: Discover the current Dataset
      security:
        - operator: []
        - enrollment: []
        - asset: []
        - plugin: []
      responses:
        '200':
          description: Current Dataset identity and writing release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /entities:
    post:
      operationId: createEntity
      summary: Enroll an Asset with deployment authorization
      description: |
        The request ID and original facts identify one enrollment. A matching
        retry returns the current Asset with 200; changed facts under the same
        request or Asset ID conflict.
      security:
        - enrollment: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetEnrollmentRequest'
      responses:
        '201':
          description: Asset enrolled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEnrollmentResult'
        '200':
          description: Matching enrollment retry; the current Asset is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEnrollmentResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /entities/{entity_id}:
    get:
      operationId: getEntity
      summary: Read an operational Entity
      security:
        - operator: []
        - asset: []
        - plugin: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Current Entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: patchEntity
      summary: Report changed components of the authenticated Asset
      description: Only the Asset itself may report. Each fresh report records contact; see AssetReport for merge rules.
      security:
        - asset: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetReport'
      responses:
        '200':
          description: Current Entity after the report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /entities/{entity_id}/status:
    get:
      operationId: getAssetStatus
      summary: Read an Asset's status and contact freshness
      security:
        - operator: []
        - asset: []
        - plugin: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Current status, communications and contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetStatusView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: reportAssetStatus
      summary: Report an Asset's own operational status
      description: Only the Asset itself may report. Reports apply in increasing sequence order; resending a report ID with the same facts returns the current Asset.
      security:
        - asset: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetStatusReport'
      responses:
        '200':
          description: Current Asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /entities/{entity_id}/checkin:
    post:
      operationId: checkInAsset
      summary: Check in, reporting current Asset state and contact
      security:
        - asset: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetReport'
      responses:
        '200':
          description: Current Entity after the report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /queries/full:
    get:
      operationId: queryFull
      summary: Load a paginated operational picture with one baseline
      description: |
        Every page of one snapshot shares the baseline of the first page.
        Entities created after the baseline are left to replay from
        `baseline`; Entities on later pages may already include changes made
        after the baseline, so apply replayed changes only when newer.
      security:
        - operator: []
        - asset: []
        - plugin: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of Entities in the current Dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /queries/changed-since:
    get:
      operationId: queryChangedSince
      summary: Replay committed changes after a Dataset-bound cursor
      security:
        - operator: []
        - asset: []
        - plugin: []
      parameters:
        - name: cursor
          in: query
          required: true
          schema:
            type: string
            maxLength: 512
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Committed changes in sequence order and the cursor after them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/CursorExpired'
  /feed:
    get:
      operationId: getFeed
      summary: Follow committed changes over a WebSocket
      description: |
        A WebSocket upgrade. Browsers cannot set headers on the upgrade, so
        the client sends FeedAuthentication as its first message instead of
        an Authorization header; the security below lists the kinds of
        credential it may carry. Core then sends FeedHello and a FeedChange
        for every later commit, in sequence order. If the client falls
        behind the retained change log, Core sends FeedGap and closes.
      security:
        - operator: []
        - asset: []
        - plugin: []
      responses:
        '101':
          description: Switching to the WebSocket protocol.
  /plugins:
    get:
      operationId: listPlugins
      summary: Discover installed Plugins and their availability
      security:
        - operator: []
        - asset: []
        - plugin: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Installed Plugins in ID order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /plugins/{plugin_id}:
    get:
      operationId: getPlugin
      summary: Inspect one installed Plugin
      security:
        - operator: []
        - asset: []
        - plugin: []
      parameters:
        - $ref: '#/components/parameters/PluginId'
      responses:
        '200':
          description: The Plugin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plugins/{plugin_id}/operations:
    get:
      operationId: listPluginOperations
      summary: List a Plugin's retained Operation attempts, newest first
      security:
        - operator: []
        - asset: []
        - plugin: []
      parameters:
        - $ref: '#/components/parameters/PluginId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Retained attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: submitPluginOperation
      summary: Submit a durable Operation attempt
      description: |
        Core retains the attempt before dispatching it to the Plugin, so a
        caller that disconnects afterwards cannot stop it. Resubmitting the
        same submission ID with the same facts returns the original attempt;
        changed facts conflict. There is no automatic rerun.
      security:
        - operator: []
        - asset: []
        - plugin: []
      parameters:
        - $ref: '#/components/parameters/PluginId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationSubmission'
      responses:
        '202':
          description: The attempt is retained and will be dispatched, or this is its retry.
          headers:
            Location:
              description: Where to read the attempt.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /plugins/{plugin_id}/operations/{operation_id}:
    get:
      operationId: getPluginOperation
      summary: Read a retained Operation attempt and its known outcome
      security:
        - operator: []
        - asset: []
        - plugin: []
      parameters:
        - $ref: '#/components/parameters/PluginId'
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: The attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plugins/{plugin_id}/operations/{operation_id}/cancel:
    post:
      operationId: cancelPluginOperation
      summary: Request cancellation of one Operation attempt
      description: |
        An attempt Core has not dispatched is canceled at once. A dispatched
        one becomes cancellation_requested until the Plugin reports its
        outcome, which may still be completed or failed. A terminal attempt
        is returned unchanged. Canceling an attempt never stops its Plugin.
      security:
        - operator: []
        - asset: []
        - plugin: []
      parameters:
        - $ref: '#/components/parameters/PluginId'
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: The attempt after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /plugins/{plugin_id}/operations/{operation_id}/reports:
    post:
      operationId: reportPluginOperation
      summary: Report progress or an outcome for one of the Plugin's own attempts
      description: |
        Only the Plugin that owns the attempt may report. A confirmed
        terminal outcome is immutable: repeating it succeeds, changing it
        conflicts. A failed outcome carries an error.
      security:
        - plugin: []
      parameters:
        - $ref: '#/components/parameters/PluginId'
        - $ref: '#/components/parameters/OperationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationReport'
      responses:
        '200':
          description: The attempt after the report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,62}$'
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Page size. Defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    EntityId:
      name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    operator:
      type: http
      scheme: bearer
      description: Administrative credential issued by local setup or recovery.
    enrollment:
      type: http
      scheme: bearer
      description: Deployment enrollment authority created by local setup. It may only enroll Assets.
    asset:
      type: http
      scheme: bearer
      description: An enrolled Asset's own credential, bound to its Entity ID.
    plugin:
      type: http
      scheme: bearer
      description: A managed Plugin's integration credential, issued when local management installs it.
  responses:
    BadRequest:
      description: The request does not match the operation's schema or rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or unknown credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credential's kind may not call this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: The Plugin already has its maximum of unfinished attempts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CursorExpired:
      description: The retained change log no longer covers this cursor; load a new snapshot.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with a retained identity, order or the current Dataset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [alive]
    DependencyStatus:
      type: string
      enum: [ready, unavailable]
    Readiness:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        dependencies:
          type: object
          additionalProperties: false
          required: [sqlite, objects]
          properties:
            sqlite:
              $ref: '#/components/schemas/DependencyStatus'
            objects:
              $ref: '#/components/schemas/DependencyStatus'
    Dataset:
      type: object
      additionalProperties: false
      required: [id, writing_release]
      properties:
        id:
          type: string
          format: uuid
        writing_release:
          type: string
    AssetStatus:
      type: string
      enum: [unknown, initializing, ready, busy, paused, error, stopped]
    Communications:
      type: string
      enum: [high_bandwidth, healthy, degraded, offline]
    Entity:
      type: object
      additionalProperties: false
      required: [dataset_id, id, kind, alias, subtype, components, command_manifest, version, change_sequence]
      properties:
        dataset_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [asset]
        alias:
          type: string
          nullable: true
        subtype:
          type: string
          nullable: true
        components:
          $ref: '#/components/schemas/AssetComponents'
        command_manifest:
          type: array
          items:
            $ref: '#/components/schemas/CommandSupport'
        version:
          type: integer
          minimum: 1
        change_sequence:
          type: integer
          format: int64
          minimum: 1
          description: Sequence of the committed change that produced this state.
    AssetComponents:
      type: object
      additionalProperties: false
      required: [status, communications, heartbeat]
      properties:
        status:
          $ref: '#/components/schemas/AssetStatusComponent'
        communications:
          $ref: '#/components/schemas/AssetCommunicationsComponent'
        heartbeat:
          $ref: '#/components/schemas/AssetHeartbeatComponent'
        telemetry:
          $ref: '#/components/schemas/AssetTelemetryComponent'
        health:
          $ref: '#/components/schemas/AssetHealthComponent'
    AssetStatusComponent:
      type: object
      additionalProperties: false
      required: [value, reported_at]
      properties:
        value:
          $ref: '#/components/schemas/AssetStatus'
        reported_at:
          type: string
          format: date-time
          nullable: true
          description: When Core accepted the latest status report; null until the Asset reports status.
    AssetCommunicationsComponent:
      type: object
      additionalProperties: false
      required: [link_state]
      properties:
        link_state:
          $ref: '#/components/schemas/Communications'
    AssetHeartbeatComponent:
      type: object
      additionalProperties: false
      required: [last_seen]
      properties:
        last_seen:
          type: string
          format: date-time
          nullable: true
    AssetInitialStatus:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          $ref: '#/components/schemas/AssetStatus'
    AssetInitialComponents:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/AssetInitialStatus'
        telemetry:
          $ref: '#/components/schemas/AssetTelemetryComponent'
        health:
          $ref: '#/components/schemas/AssetHealthComponent'
    AssetTelemetryComponent:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Latitude and longitude are supplied together.
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        altitude_m:
          type: number
          format: double
        speed_mps:
          type: number
          format: double
          minimum: 0
        heading_deg:
          type: number
          format: double
          minimum: 0
          maximum: 360
          exclusiveMaximum: true
    AssetHealthComponent:
      type: object
      additionalProperties: false
      required: [battery_percent]
      properties:
        battery_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
    CommandSupport:
      type: object
      additionalProperties: false
      required: [command_id, scheduling]
      properties:
        command_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        scheduling:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [queued, immediate]
        cancellation:
          type: boolean
        progress:
          type: boolean
        description:
          type: string
          maxLength: 256
    AssetEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [dataset_id, id, request_id, kind, credential]
      properties:
        dataset_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [asset]
        credential:
          type: string
          pattern: '^atlas_asset_[A-Za-z0-9_-]{43}$'
          description: The Asset's own credential, prepared and retained by the SDK before the first attempt.
        alias:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
          description: Unique across Entities, ignoring case.
        subtype:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '\S'
        components:
          $ref: '#/components/schemas/AssetInitialComponents'
        command_manifest:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/CommandSupport'
    AssetEnrollmentResult:
      type: object
      additionalProperties: false
      required: [asset, principal_id, credential_id]
      properties:
        asset:
          $ref: '#/components/schemas/Entity'
        principal_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
    AssetStatusReport:
      type: object
      additionalProperties: false
      required: [dataset_id, report_id, sequence, status]
      properties:
        dataset_id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: '#/components/schemas/AssetStatus'
    AssetStatusView:
      type: object
      additionalProperties: false
      required: [status, communications, heartbeat]
      properties:
        status:
          $ref: '#/components/schemas/AssetStatusComponent'
        communications:
          $ref: '#/components/schemas/AssetCommunicationsComponent'
        heartbeat:
          $ref: '#/components/schemas/AssetHeartbeatComponent'
    AssetReport:
      type: object
      additionalProperties: false
      description: |
        One Asset-originated change. A fresh report records contact even with
        no components. Reports apply in increasing sequence order; resending a
        report ID with the same facts returns the current Entity. Present
        components merge into stored ones (see each patch schema);
        `command_manifest` replaces the stored manifest.
      required: [dataset_id, report_id, sequence]
      properties:
        dataset_id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        components:
          $ref: '#/components/schemas/AssetComponentPatch'
        command_manifest:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/CommandSupport'
    AssetComponentPatch:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/AssetInitialStatus'
        telemetry:
          $ref: '#/components/schemas/AssetTelemetryPatch'
        health:
          $ref: '#/components/schemas/AssetHealthPatch'
    AssetTelemetryPatch:
      type: object
      nullable: true
      additionalProperties: false
      description: |
        Present fields replace stored values and null clears a field; null
        for the whole component clears all telemetry. After merging,
        latitude and longitude must be both present or both absent.
      properties:
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        altitude_m:
          type: number
          format: double
          nullable: true
        speed_mps:
          type: number
          format: double
          nullable: true
          minimum: 0
        heading_deg:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 360
          exclusiveMaximum: true
    AssetHealthPatch:
      type: object
      nullable: true
      additionalProperties: false
      description: Replaces stored health; null clears it.
      required: [battery_percent]
      properties:
        battery_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
    EntityPage:
      type: object
      additionalProperties: false
      required: [dataset_id, baseline, baseline_sequence, entities]
      properties:
        dataset_id:
          type: string
          format: uuid
        baseline:
          type: string
          description: Change cursor at the snapshot's baseline; replay from it after the last page.
        baseline_sequence:
          type: integer
          format: int64
          minimum: 0
        entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        next_cursor:
          type: string
    EntityChange:
      type: object
      additionalProperties: false
      required: [dataset_id, sequence, resource_type, resource_id, kind, entity]
      properties:
        dataset_id:
          type: string
          format: uuid
        sequence:
          type: integer
          format: int64
          minimum: 1
        resource_type:
          type: string
          enum: [entity]
        resource_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [create, update]
        entity:
          $ref: '#/components/schemas/Entity'
    ChangePage:
      type: object
      additionalProperties: false
      required: [dataset_id, changes, cursor]
      properties:
        dataset_id:
          type: string
          format: uuid
        changes:
          type: array
          items:
            $ref: '#/components/schemas/EntityChange'
        cursor:
          type: string
          description: Cursor after the last returned change, or unchanged when there are none.
    FeedAuthentication:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key:
          type: string
          maxLength: 128
    FeedHello:
      type: object
      additionalProperties: false
      required: [type, dataset_id, cursor, sequence]
      properties:
        type:
          type: string
          enum: [hello]
        dataset_id:
          type: string
          format: uuid
        cursor:
          type: string
          description: Change cursor at the subscription point; every later commit is delivered.
        sequence:
          type: integer
          format: int64
          minimum: 0
    FeedChange:
      type: object
      additionalProperties: false
      required: [type, change, cursor]
      properties:
        type:
          type: string
          enum: [change]
        change:
          $ref: '#/components/schemas/EntityChange'
        cursor:
          type: string
          description: Change cursor after this change.
    FeedGap:
      type: object
      additionalProperties: false
      required: [type, code]
      properties:
        type:
          type: string
          enum: [gap]
        code:
          type: string
          enum: [cursor_expired]
    Plugin:
      type: object
      additionalProperties: false
      required: [id, release, availability, capabilities]
      properties:
        id:
          type: string
        release:
          type: string
        availability:
          type: string
          enum: [available, unavailable, faulted]
          description: |
            available: running and admitting Operations. unavailable: stopped,
            stopping or unreachable. faulted: Core lost the Plugin or a stop
            failed; unfinished outcomes may be unknown until local
            management starts it again.
        fault:
          type: string
          description: Why the Plugin is faulted.
        capabilities:
          type: array
          items:
            type: string
    PluginPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plugin'
        next_cursor:
          type: string
    OperationStatus:
      type: string
      enum: [pending, in_progress, cancellation_requested, completed, canceled, failed, interrupted]
      description: |
        completed, canceled, failed and interrupted are terminal.
        interrupted means Core cannot establish the outcome.
    OperationSubmission:
      type: object
      additionalProperties: false
      required: [dataset_id, submission_id, capability, input]
      properties:
        dataset_id:
          type: string
          format: uuid
        submission_id:
          type: string
          format: uuid
        capability:
          type: string
          maxLength: 128
        input:
          type: object
          additionalProperties: true
          description: Must match the capability's input schema from the Plugin manifest.
    Operation:
      type: object
      additionalProperties: false
      required: [id, dataset_id, submission_id, plugin_id, plugin_release, capability, input, status, output, error, created_at]
      properties:
        id:
          type: string
          format: uuid
        dataset_id:
          type: string
          format: uuid
        submission_id:
          type: string
          format: uuid
        plugin_id:
          type: string
        plugin_release:
          type: string
        capability:
          type: string
        input:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/OperationStatus'
        output:
          type: object
          nullable: true
          additionalProperties: true
          description: The latest known output; kept when an attempt fails or is interrupted.
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    OperationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        next_cursor:
          type: string
    OperationReport:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, completed, failed, canceled]
        output:
          type: object
          additionalProperties: true
          description: Replaces the known output.
        error:
          type: string
          minLength: 1
          maxLength: 1024
          description: Required with failed, and only allowed on a terminal outcome.
